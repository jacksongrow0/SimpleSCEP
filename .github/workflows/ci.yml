name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: simplescep
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simplescep"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.5"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run assets:build
      - run: go tool templ generate
      - run: go test ./...
      - name: Verify the clean database baseline
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d simplescep -f internal/database/migrations/0001_open_source.sql
          test "$(psql -At -h localhost -U postgres -d simplescep -c "select count(*) from information_schema.tables where table_schema='public' and (table_name like 'stripe%' or table_name like 'billing%' or table_name like 'support_ticket%')")" = "0"
      - run: docker build -t simplescep:test .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
